<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeon Browser 3D Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="ui">
      <div id="playerPanel">
        <div class="bar-label">HP <span id="playerHpText"></span></div>
        <div class="bar"><div id="playerHpBar" class="fill hp"></div></div>
        <div class="bar-label">Stamina <span id="playerStaminaText"></span></div>
        <div class="bar"><div id="playerStaminaBar" class="fill stamina"></div></div>
        <div class="bar-label">XP <span id="playerXpText"></span></div>
        <div class="bar"><div id="playerXpBar" class="fill xp"></div></div>
        <div id="stats"></div>
      </div>
      <div id="weaponPanel"></div>
      <div id="message"></div>
      <div id="crosshair">+</div>
      <div id="help">
        Click game to lock mouse • WASD move • Shift sprint • Space jump • C dodge • LMB attack/shoot • R reload • 1/2 or mousewheel switch weapon
      </div>
    </div>
    <script type="module" src="game.js"></script>
  </body>
</html>
